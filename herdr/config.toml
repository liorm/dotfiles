onboarding = false

[ui.toast]
delivery = "herdr"

[ui]
show_agent_labels_on_pane_borders = true

[theme]
name = "catppuccin"
auto_switch = false

[keys]
prefix = "±"
reload_config = "prefix+r"
split_vertical = ["prefix+minus", "prefix+-"]
split_horizontal = ["prefix+shift+minus", "prefix+shift+-", "prefix+shift+underscore", "prefix+underscore", "prefix+_"]
focus_pane_up = "prefix+up"
focus_pane_down = "prefix+down"
focus_pane_left = "prefix+left"
focus_pane_right = "prefix+right"
previous_tab = "prefix+shift+left"
next_tab = "prefix+shift+right"
